name: ページの再生成

on:
  workflow_dispatch:
    inputs:
      target_page:
        description: '再生成するページ'
        required: true
        type: choice
        options:
          - jpml_pros
        # 他ページ用のスクリプトを追加したら、ここにも選択肢を増やす

  push:
    branches:
      - cloudflare
    paths:
      # jpml_pros関連のソースが変更されたら自動でjpml_pros.htmlを再生成する。
      # 他ページを自動化したら、同様のpathsエントリを追加する。
      - 'jpml_pros.js'
      - 'scripts/generate_jpml_pros.py'
      - 'scripts/lib/sheets.py'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: cloudflare

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 対象ページを決定
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "page=${{ github.event.inputs.target_page }}" >> "$GITHUB_OUTPUT"
          else
            # push トリガー時は、変更されたファイル群に対応する
            # jpml_pros で固定(自動化ページが増えたらここも要拡張)
            echo "page=jpml_pros" >> "$GITHUB_OUTPUT"
          fi

      - name: 対象ページを再生成
        run: python3 scripts/generate_${{ steps.target.outputs.page }}.py

      - name: 変更をコミット・push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.target.outputs.page }}.html
          git diff --cached --quiet || git commit -m "chore: regenerate ${{ steps.target.outputs.page }}.html via GitHub Actions"
          git push origin cloudflare
