name: ページの再生成

# 対象ページは scripts/generate_<ページ名>.py の有無から自動で判別する。
# 新しいページを自動化するときは生成スクリプトを1本足すだけでよく、
# このファイルを書き換える必要はない。

on:
  workflow_dispatch:
    inputs:
      target_page:
        description: '再生成するページ。all ですべて。複数ならスペース区切り'
        required: true
        default: 'all'
        type: string

  schedule:
    # 毎週月曜 05:37 JST（日曜 20:37 UTC）。
    # スプレッドシートの更新はpushでは検知できないため、定期的に all を回す。
    # 毎時00分はGitHub側の実行が集中して遅延しやすいので37分にずらしている。
    - cron: '37 20 * * 0'

  push:
    branches:
      - cloudflare
    paths:
      # 生成スクリプトか、ページ専用のJSが変わったときに動かす。
      # 実際にどのページを作り直すかは scripts/regenerate.py が判定する。
      # 生成物(*.html)は対象外なので、自分のコミットで再帰的に動くことはない。
      #
      # table.js(型Aの共通JS、#7)もこの '*.js' に含まれてこのワークフローは
      # 起動するが、scripts/regenerate.py 側は "table.js" をどのページ名にも
      # 一致させないため、対象0件で何もせず終わる(害はないが無駄な実行には
      # なる)。table.jsはHTMLに焼き込まれないので再生成の対象にはならない。
      - 'scripts/generate_*.py'
      - 'scripts/lib/**'
      - '*.js'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: cloudflare
          # push範囲(github.event.before 〜 github.sha)の差分を取るため全履歴が要る。
          # fetch-depth: 2 では最終コミット1つ分しか遡れず、複数コミットをまとめて
          # pushしたときに途中のコミットの変更を取りこぼしていた(#167)
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 対象ページを再生成
        id: regen
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # pushに含まれる全コミットの差分から、作り直すべきページを判定する。
            # 最終コミット1つ分(HEAD^ HEAD)だけを見ると、複数コミットをまとめて
            # pushしたときに途中のコミットの変更を取りこぼす(#167)
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] \
              || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              # ブランチ新規作成やforce pushでは before が取れない(全0)か、
              # 既に存在しないコミットを指す。範囲が確定しないので安全側に倒す
              echo "push範囲を特定できないため all で再生成する (before=$BEFORE)"
              python3 scripts/regenerate.py all | tee /tmp/targets.txt
            else
              echo "push範囲: $BEFORE..$AFTER"
              git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed.txt
              echo "変更されたファイル:"
              cat /tmp/changed.txt
              python3 scripts/regenerate.py --changed $(cat /tmp/changed.txt) \
                | tee /tmp/targets.txt
            fi
          else
            # workflow_dispatch と schedule。
            # schedule では inputs が空になるので all にフォールバックする。
            TARGET="${{ github.event.inputs.target_page }}"
            if [ -z "$TARGET" ]; then
              TARGET=all
            fi
            echo "対象: $TARGET"
            python3 scripts/regenerate.py $TARGET | tee /tmp/targets.txt
          fi
          echo "files=$(cat /tmp/targets.txt)" >> "$GITHUB_OUTPUT"

      - name: サイトマップのlastmodを更新
        if: steps.regen.outputs.files != ''
        run: |
          # git add する前に、再生成対象のうち実際に差分が出たファイルだけを調べる。
          # wayhome_episodes(#162)は対象が"wayhome/"(ディレクトリ)になり、
          # 削除されたページも --name-only に含まれる(存在しないURLは
          # update_sitemap_lastmod.py側で無視される)。
          CHANGED=$(git diff --name-only -- ${{ steps.regen.outputs.files }})
          echo "実際に差分が出たファイル: $CHANGED"
          if [ -n "$CHANGED" ]; then
            python3 scripts/update_sitemap_lastmod.py $CHANGED
          fi

      - name: サイトマップのwell-formednessを確認
        if: steps.regen.outputs.files != ''
        # sitemap-pages.xmlのコメントに"--"(XMLコメントでは禁止)が混入し、
        # GSCで「型: 不明」エラーになったことがある(#162本番検証)。
        # generate_wayhome_episodes.pyが書き出すsitemap-wayhome.xmlも
        # 同じ理由でここで確認する。
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          for f in ['sitemap.xml', 'sitemap-pages.xml', 'sitemap-wayhome.xml']:
              try:
                  ET.parse(f)
                  print(f + ': OK')
              except ET.ParseError as e:
                  print(f'::error::{f} が well-formed XML ではありません: {e}')
                  sys.exit(1)
          "

      - name: 変更をコミット・push
        if: steps.regen.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A --で削除も拾う(wayhome_episodesはシートから消えた動画IDの
          # ページを削除するため、#162)。sitemap*.xmlはsitemap.xml(インデックス)・
          # sitemap-pages.xml・sitemap-wayhome.xmlをまとめて拾う。
          git add -A -- ${{ steps.regen.outputs.files }} sitemap*.xml
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "chore: regenerate ${{ steps.regen.outputs.files }} via GitHub Actions"
          git push origin cloudflare
