name: 本番へデプロイ

# Cloudflare Workers の静的アセットとして本番(ryoei.pro)へ反映する。
#
# Claude Code のセッション環境からは api.cloudflare.com がネットワークポリシーで
# 遮断されているため、セッション内から直接 wrangler deploy を実行できない(#169)。
# GitHub Actions の runner は外部へ出られるので、デプロイはここで行う。
#
# 認証はリポジトリ Secret の CLOUDFLARE_API_TOKEN。トークンはリポジトリにも
# ログにも現れない。第三者製の action は使わず npx wrangler を直接叩いている
# (regenerate-page.yml と同じ流儀で、依存を増やさないため)。

on:
  # cloudflare へ push されたら反映する。regenerate-page.yml が
  # 「chore: regenerate ... via GitHub Actions」を push した場合も対象になり、
  # スプレッドシートの更新が自動で本番へ届く。
  push:
    branches:
      - cloudflare

  workflow_dispatch:
    inputs:
      check_only:
        description: 'デプロイせず、トークンが有効かどうかだけ確認する'
        required: false
        default: false
        type: boolean

# デプロイ同士が重ならないようにする。走っているものは止めない
# (途中で切ると中途半端な状態で終わりうるため)。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: cloudflare

      - name: Secret の有無を確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN が未登録です。"
            echo "Cloudflare でテンプレート「Edit Cloudflare Workers」のトークンを発行し、"
            echo "GitHub の Settings → Secrets and variables → Actions に"
            echo "CLOUDFLARE_API_TOKEN として登録してください（詳細は #169）。"
            exit 1
          fi

      # 公開されるファイルの最上位を毎回ログに残す。.assetsignore の漏れ
      # (#133 の再発)に気づけるようにするため。ここに docs や scripts が
      # 出ていたら異常。
      - name: 公開対象の最上位を確認
        run: |
          echo "--- .assetsignore ---"
          cat .assetsignore
          echo
          echo "--- 除外後に配信される最上位の項目 ---"
          grep -v '^[[:space:]]*#' .assetsignore | grep -v '^[[:space:]]*$' > /tmp/ignored.txt
          # core.quotePath=false が必須。既定では非ASCIIを含むパスが
          # "docs/..." のように引用符ごと出力され、先頭が `"docs` になって
          # .assetsignore の `docs` と一致せず誤検出する
          # (docs/gsc 配下に日本語名のCSVがある)。
          git -c core.quotePath=false ls-files | cut -d/ -f1 | sort -u \
            | grep -vxF -f /tmp/ignored.txt || true

      - name: Node をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 複数アカウントに属するトークンの場合のみ必要。未設定でも動く。
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler は版を固定する(package.json が無く npx が毎回最新を取るため、
          # 固定しないと再現性が無くなる)。上げるときはこの行を変えること。
          WRANGLER=wrangler@4.131.1
          if [ "${{ inputs.check_only }}" = "true" ]; then
            # トークンが有効か、どのアカウントに対して権限があるかを見るだけ。
            # 本番には一切触らない。Secret 登録直後の疎通確認に使う。
            echo "check_only: デプロイせず whoami のみ実行する"
            npx --yes "$WRANGLER" whoami
          else
            npx --yes "$WRANGLER" deploy
          fi
