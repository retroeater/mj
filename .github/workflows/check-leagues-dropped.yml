name: 型Cで漏れている選手の検知

# 型C(houou_leagues / ouka_leagues)で、リーグの実データがあるのに
# 選手選択リストから漏れている選手がいないかを確認する(#168の項目2)。
#
# 定期実行にはしていない。#168の判断材料を得るための手動実行を想定した
# もので、期が変わったときなど必要に応じて回せばよい。
# (常時監視が必要と分かったら schedule を足す)
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: '結果をコメントするissue番号（空にするとコメントしない）'
        required: false
        default: '168'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: cloudflare

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 漏れている選手を確認
        run: |
          python3 scripts/check_leagues_dropped.py --json result.json | tee summary.md

      - name: 実行サマリに表示
        run: |
          {
            echo '# 型Cで漏れている選手の検知結果'
            echo
            cat summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 結果をissueにコメント
        if: ${{ inputs.issue_number != '' }}
        uses: actions/github-script@v7
        env:
          # ${{ }} をscript本文へ直接展開せず、envを経由して読む
          # (workflow_dispatchの入力は任意の文字列を渡せるため)
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.md', 'utf8');
            const body = [
              '## 型Cで漏れている選手の検知結果',
              '',
              `\`scripts/check_leagues_dropped.py\` を GitHub Actions で実行した結果（[実行ログ](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})）。`,
              '',
              summary,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });
