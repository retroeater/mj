name: 龍龍アクセス診断(一時)

# ron2.jp のどのパスがGitHub Actionsから到達できるかを調べるための一時的なもの。
# 原因が判明したら、このファイルと scripts/diagnose_ron2.py は削除してよい。

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 到達可否を確認
        run: |
          set -o pipefail
          python3 scripts/diagnose_ron2.py 2>&1 | tee diag.txt

      - name: 実行サマリに表示
        if: always()
        run: |
          {
            echo '## 龍龍アクセス診断'
            echo '```'
            cat diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
